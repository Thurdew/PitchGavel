services:
  - type: web
    name: pitchgavel
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # node:sqlite 22.13+ sürümlerinde bayraksız; 22.11'de --experimental-sqlite olmadan açılışta çöker.
      - key: NODE_VERSION
        value: 22.14.0
      # Secure cookie + trust proxy (bkz. server/src/index.js)
      - key: NODE_ENV
        value: production
      # Doğrulama e-postasındaki link bu adrese gider — ayarlanmazsa localhost'a gider.
      - key: APP_BASE_URL
        value: https://pitchgavel.com
      - key: EMAIL_FROM
        value: PitchGavel <noreply@pitchgavel.com>
      # Gizli — Render dashboard'dan elle girilir, repoya yazılmaz.
      - key: RESEND_API_KEY
        sync: false
      # Kalıcı hesap veritabanı (Turso) — ücretsiz planda yerel disk her deploy'da sıfırlandığı
      # için. İkisi de gizli, Render dashboard'dan elle girilir. Tanımlı değilse sunucu yerel
      # SQLite dosyasına düşer (hesaplar deploy'da silinir).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
